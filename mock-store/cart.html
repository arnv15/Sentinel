<!doctype html>
<!-- MockMart — STATIC DEMO. Cart lives in localStorage only. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Cart — MockMart</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap" id="main">
    <p class="crumbs"><a href="index.html">Home</a> &rsaquo; Cart</p>
    <h1>Your cart</h1>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div id="body"></div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/data.js"></script>
  <script src="assets/store.js"></script>
  <script>
    renderHeader();
    renderFooter();

    function draw() {
      const { lines, subtotal, shipping, tax, total } = cartTotals();
      const body = document.getElementById("body");

      if (lines.length === 0) {
        body.innerHTML = `<div class="empty">
            <p>Your cart is empty.</p>
            <p><a class="btn" href="index.html">Start shopping</a></p>
          </div>`;
        return;
      }

      body.innerHTML = `
        <table>
          <caption class="sr-only">Items in your cart</caption>
          <thead>
            <tr>
              <th scope="col">Item</th>
              <th scope="col" class="num">Price</th>
              <th scope="col">Quantity</th>
              <th scope="col" class="num">Total</th>
              <th scope="col"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody>
            ${lines.map((l) => `
              <tr>
                <td>
                  <div class="cart-item">
                    <img class="thumb" src="${placeholder(l.product, 120)}" alt="" width="58" height="58">
                    <div>
                      <a href="product.html?id=${l.product.id}">${l.product.name}</a>
                      <div class="rating">SKU ${l.product.sku} &middot; limit ${l.product.limit}</div>
                    </div>
                  </div>
                </td>
                <td class="num">${money(l.product.price)}</td>
                <td>
                  <label class="sr-only" for="qty-${l.id}">Quantity for ${l.product.name}</label>
                  <input type="number" id="qty-${l.id}" data-qty="${l.id}" value="${l.qty}"
                         min="1" max="${Math.min(l.product.limit, l.product.stock)}"
                         style="width:70px;padding:7px;border:1px solid var(--line);border-radius:8px">
                </td>
                <td class="num">${money(l.lineTotal)}</td>
                <td>
                  <button class="btn danger" data-remove="${l.id}"
                          aria-label="Remove ${l.product.name} from cart">Remove</button>
                </td>
              </tr>`).join("")}
          </tbody>
        </table>

        <div class="totals">
          <div><span>Subtotal</span><span>${money(subtotal)}</span></div>
          <div><span>Shipping</span><span>${shipping === 0 ? "FREE" : money(shipping)}</span></div>
          <div><span>Estimated tax</span><span>${money(tax)}</span></div>
          <div class="grand"><span>Order total</span><span>${money(total)}</span></div>
          <p style="margin-top:16px">
            <a class="btn block" href="checkout.html">Proceed to Checkout</a>
          </p>
          <p><a href="index.html">Continue shopping</a></p>
        </div>`;

      document.querySelectorAll("[data-qty]").forEach((input) => {
        input.addEventListener("change", () => {
          setQty(input.getAttribute("data-qty"), parseInt(input.value, 10) || 1);
          draw();
        });
      });

      document.querySelectorAll("[data-remove]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-remove");
          const name = byId(id).name;
          removeFromCart(id);
          const s = document.getElementById("status");
          s.textContent = `Removed ${name} from cart.`;
          s.className = "status ok";
          draw();
        });
      });
    }

    draw();
  </script>
</body>
</html>
